name: Run PR Checks
on: [pull_request]
jobs:
  check_changelog:
    name: Verify Changelog Updated
    runs-on: ubuntu-latest
    steps:
    - name: Verify Changelog Updated
      uses: takanuva15/verify-file-updated@v1
  check_readme:
    name: Verify Readme Updated
    runs-on: ubuntu-latest
    steps:
      - name: Verify Readme Updated
        uses: takanuva15/verify-file-updated@v1
        with:
          excused_label: readme update optional
          filename_to_check: README.md
  check_contributing:
    name: Verify Contributing Updated
    runs-on: ubuntu-latest
    steps:
      - name: Verify Contributing Updated
        uses: takanuva15/verify-file-updated@v1
        with:
          excused_label: contributing update optional
          filename_to_check: CONTRIBUTING.md
  validate_pr_title:
    name: Validate PR Title
    runs-on: ubuntu-latest
    steps:
      - name: PR Conventional Commit Validation
        uses: ytanikin/pr-conventional-commits@1.4.0
        with:
          task_types: '["feat","fix","docs","test","ci","refactor","perf","chore","revert"]'
          add_label: 'false'
  qodana:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          java-version: 21
          distribution: temurin
          cache: gradle
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
      - name: 'Qodana Scan'
        uses: JetBrains/qodana-action@v2026.1
        with:
          pr-mode: false
        env:
          QODANA_TOKEN: ${{ secrets.QODANA_TOKEN_504518424 }}
          QODANA_ENDPOINT: 'https://qodana.cloud'
